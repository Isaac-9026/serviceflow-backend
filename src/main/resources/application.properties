# Configuración de base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/serviceflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:12345}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Flyway (Migraciones)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-on-validation-error=true

# JWT
jwt.secret=${JWT_SECRET:mi-clave-secreta-de-desarrollo-que-debe-tener-al-menos-256-bits-para-hmac-sha256}
jwt.expiration=86400000

# Almacenamiento de archivos (Storage local)
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
